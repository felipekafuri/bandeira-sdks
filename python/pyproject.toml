[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bandeira"
version = "0.2.0"
description = "Official Python client SDK for Bandeira feature flag service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Felipe Kafuri" }]
keywords = ["feature-flags", "feature-toggles", "bandeira", "sdk"]
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/felipekafuri/bandeira-sdks"
