name: Go SDK

on:
  push:
    branches: [main]
    tags:
      - "go/v*"
  pull_request:
    paths:
      - "go/**"
      - "testdata/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go test -v -race ./...
