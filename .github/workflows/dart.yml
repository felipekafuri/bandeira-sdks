name: Dart SDK

on:
  push:
    branches:
      - main
    tags:
      - "dart/v*"
  pull_request:
    paths:
      - "dart/**"
      - "testdata/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/dart/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --force
